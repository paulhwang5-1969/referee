<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裁判排班表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2421;--mute:#68716c;--line:#dfe3de;--acc:#1f6f4a;--acc2:#e7f2ec;--warn:#b4561b;--warnbg:#fdf1e7;--err:#b3261e;--errbg:#fbeaea;--ok:#1f6f4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.05em}
header .sp{flex:1}
#status{font-size:13px;opacity:.85}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--mute);font-size:12px}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri:hover{filter:brightness(1.1)}
button.ghost{border-color:transparent;background:transparent;color:var(--mute);padding:4px 8px}
button.ghost:hover{color:var(--err)}
header button,header .btnlike{font:inherit;background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:7px;padding:6px 12px;cursor:pointer}
header button.pri{background:#3fa66f;border-color:#3fa66f}
input,select{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
.fld input,.fld select{font-size:15px;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:#fff}
.li.on{border-color:var(--acc);background:var(--acc2)}
.li b{display:block;font-size:14px}
.li span{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mute);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:5px 6px;border-bottom:1px solid #eef0ec;vertical-align:middle}
td.n{font-weight:700;width:36px}
td input.t{width:64px}
@media(max-width:600px){td{padding:4px 2px}td select{font-size:14px;padding:6px 4px}}
td select{width:100%}
tr.bad td{background:var(--errbg)}
.msg{font-size:12px;color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--acc2);border-radius:20px;padding:3px 4px 3px 10px;font-size:14px}
.chip button{border:0;background:transparent;padding:0 6px;color:var(--mute)}
.chip.x{background:var(--warnbg)}
.stat td{font-size:14px}
.tag{font-size:12px;border-radius:5px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tag.w{background:var(--warnbg);color:var(--warn)}
.tag.e{background:var(--errbg);color:var(--err)}
.tag.o{background:var(--acc2);color:var(--ok)}
pre{background:#f7f8f6;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:inherit;white-space:pre-wrap;margin:0 0 10px}
.note{font-size:12px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:30}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:10px;padding:18px;max-width:340px;width:90%}
.modal .box p{margin:0 0 14px}
.lock{width:16px;height:16px;accent-color:var(--acc)}
</style>
</head>

<div id="app"></div>

<script id="app-js">

// ---------- solver ----------

function refSelect(val,onch){var sel=h('select',{onchange:function(e){onch(e.target.value)}});sel.appendChild(h('option',{value:'',text:'— 選擇裁判 —'}));var names=state.referees.slice();if(val&&names.indexOf(val)<0)names.push(val);names.forEach(function(n){sel.appendChild(h('option',{value:n,text:n}))});sel.value=val||'';return sel}
function tableCard(s,A){
  var c=h('div',{class:'card'},h('h2',null,'排班',h('small',{text:'勾「固定」的場次，自動排班時不會被更動'})));
  var t=h('table',null,h('tr',null,h('th',{text:'場次'}),h('th',{text:'時間'}),h('th',{text:'裁判 1'}),h('th',{text:'裁判 2'}),h('th',{text:'固定'})));
  s.games.forEach(function(g,i){var e=A.rowErr[i].filter(function(x){return x!=='尚未排滿'});
    t.appendChild(h('tr',{class:e.length?'bad':''},h('td',{class:'n',text:String(i+1)}),
      h('td',null,h('input',{class:'t',type:'text',inputmode:'numeric',placeholder:'08:00',value:g.time,onchange:function(ev){g.time=normTime(ev.target.value)||g.time;touch();render()}})),
      h('td',null,refSelect(g.a,function(v){g.a=v;touch();render()})),
      h('td',null,refSelect(g.b,function(v){g.b=v;touch();render()}),e.length?h('div',{class:'msg',text:e.join('；')}):null),
      h('td',{style:'text-align:center'},h('input',{type:'checkbox',class:'lock',checked:g.lock,onchange:function(ev){g.lock=ev.target.checked;touch()}}))));
  });
  c.appendChild(t);
  var info=h('div',{class:'note',style:'margin-top:8px'});
  c.appendChild(h('div',{class:'row',style:'margin-top:12px'},
    h('button',{class:'pri',text:'⚡ 自動排班',onclick:function(){run(false)}}),
    h('button',{text:'換一個排法',onclick:function(){run(true)}}),
    h('button',{text:'清空未固定',onclick:function(){s.games.forEach(function(g){if(!g.lock){g.a='';g.b=''}});touch();render()}})));
  c.appendChild(info);
  function run(sh){var r=solve(s,sh);if(!r){toast('至少需要 2 位裁判');return}if(r.fail){toast(r.fail);return}s.games.forEach(function(g,i){g.a=r.pick[i][0];g.b=r.pick[i][1]});touch();render();toast('已自動排班')}
  info.textContent='自動排班規則：每人以連續站兩場為原則，避開「不可同場」與「不可排場次」，並平均分配場數。場數為奇數時，會有人只站單場，優先排在第一場或最後一場。';
  return c;
}
function statCard(s,A){
  var c=h('div',{class:'card'},h('h2',{text:'出勤統計'}));
  var t=h('table',{class:'stat'},h('tr',null,h('th',{text:'裁判'}),h('th',{text:'場數'}),h('th',{text:'場次'})));
  A.stats.forEach(function(r){if(!r.games.length&&state.referees.indexOf(r.name)<0)return;
    var tags=[];r.runs.forEach(function(x){if(x.length===1)tags.push(h('span',{class:'tag w',text:'第'+x[0]+'場單場'}));else if(x.length>2)tags.push(h('span',{class:'tag e',text:'連站'+x.length+'場'}))});
    t.appendChild(h('tr',null,h('td',{text:r.name}),h('td',{text:String(r.games.length)}),h('td',null,r.runs.map(function(x){return x.length>1?x[0]+'–'+x[x.length-1]:String(x[0])}).join('、')||'—',tags)))});
  c.appendChild(t);
  var errs=A.rowErr.reduce(function(n,e){return n+e.filter(function(x){return x!=='尚未排滿'}).length},0), empty=A.rowErr.filter(function(e){return e.indexOf('尚未排滿')>=0}).length;
  c.appendChild(h('div',{style:'margin-top:10px'},errs?h('span',{class:'tag e',text:errs+' 項衝突'}):h('span',{class:'tag o',text:'✓ 無衝突'}),empty?h('span',{class:'tag w',text:empty+' 場未排滿'}):null));
  return c;
}
function outCard(s){
  var c=h('div',{class:'card'},h('h2',null,'輸出',h('small',{text:'可直接貼到 LINE'})));
  var txt=lineText(s);c.appendChild(h('pre',{text:txt}));

  row.appendChild(h('button',{text:'下載 CSV',onclick:function(){dl('裁判排班_'+(s.date||'')+'_'+(s.venue||'')+'.csv',csv(s),'text/csv')}}));
  c.appendChild(row);return c;
}
function condCard(s){
  var c=h('div',{class:'card'},h('h2',{text:'排班條件'}));
  // pairs
  c.appendChild(h('div',{class:'fld',style:'margin-bottom:6px'},'不可同場的組合（所有班表適用）'));

  if(!state.pairs.length)chips.appendChild(h('span',{class:'note',text:'無'}));

  var pa=refSelect('',function(){}),pb=refSelect('',function(){});pa.style.width=pb.style.width='130px';
  c.appendChild(h('div',{class:'row'},pa,h('span',{text:'✕'}),pb,h('button',{text:'加入',onclick:function(){var a=pa.value,b=pb.value;if(!a||!b||a===b){toast('請選兩位不同的裁判');return}if(forbid(a,b)){toast('已經有這個組合');return}state.pairs.push([a,b]);touch();render()}})));

  c.appendChild(row);return c;

function refCard(){
  var c=h('div',{class:'card'},h('h2',null,'裁判名單',h('small',{text:'下拉選單會使用這份名單'})));
  var chips=h('div',{class:'chips',style:'margin-bottom:10px'});
  state.referees.forEach(function(r,i){chips.appendChild(h('span',{class:'chip'},r,h('button',{text:'×',title:'移除',onclick:function(){ask('從名單移除「'+r+'」？已排的班表不會被改動。','移除',function(){state.referees.splice(i,1);touch();render()})}})))});
  c.appendChild(chips);
  var inp=h('input',{placeholder:'輸入姓名',style:'width:150px'});
  function add(){var v=inp.value.trim();if(!v)return;if(state.referees.indexOf(v)>=0){toast('名單已有此人');return}state.referees.push(v);touch();render()}

  c.appendChild(h('div',{class:'row'},inp,h('button',{text:'＋ 新增裁判',onclick:add})));
  return c;

document.body.appendChild(h('div',{id:'modal',class:'modal'},h('div',{class:'box'})));
